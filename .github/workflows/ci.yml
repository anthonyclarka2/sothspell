name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Empty selects Playwright's bundled Chromium in CI; local runs default
      # to the installed Chrome channel.
      PLAYWRIGHT_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm check:secrets
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm test:browser
      - run: pnpm test:a11y
      - run: pnpm test:canvas:perf
      - run: pnpm check:toolchain
