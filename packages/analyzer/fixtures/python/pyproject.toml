[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixture"
version = "0.1.0"
description = "A hand-written Python fixture for the analyzer tests."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fixture = "fixture.__main__:main"
